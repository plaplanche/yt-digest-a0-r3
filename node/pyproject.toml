[project]
name = "yt-digest-node"
version = "0.1.0"
description = "yt-digest node: transcript pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.85.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/contracts.sh: schema descriptions are kept on one line.
"src/yt_digest_node/contracts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
